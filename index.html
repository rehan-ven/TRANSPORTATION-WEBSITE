
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="artifact-type" content="narrative">
<meta name="design-style" content="canopy">
<title>The Little Transportation Adventure — Buku Cerita Interaktif Bahasa Inggris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  color-scheme: light;

  /* 1. Canopy base + Storybook Watercolor Palette */
  --background: #faf5ea;
  --surface-container-low: #f2ead9;
  --surface-container: #e8dcc5;
  --surface-container-high: #ddd0b6;
  --surface-paper-white: #fdfaf2;

  /* Ink */
  --on-surface: #27312a;
  --on-surface-variant: #49544b;

  /* Lines */
  --outline: #7a7467;
  --outline-variant: #cfc3ab;

  /* Storybook Accents: Forest Green, Warm Red, Mustard Yellow, Sky Blue */
  --primary: #2f6845;
  --on-primary: #ffffff;
  --primary-container: #d8efe0;
  --on-primary-container: #1b482c;

  --secondary: #586159;
  --tertiary: #9e6215;
  --tertiary-container: #f5dfb0;
  --on-tertiary-container: #5c3706;

  --story-red: #b83c2e;
  --on-story-red: #ffffff;
  --story-red-soft: #f7dad4;
  --on-story-red-soft: #6e1f16;

  --story-mustard: #d19422;
  --story-mustard-deep: #7a4f06;
  --story-mustard-soft: #faecc8;

  --story-sky: #3b7899;
  --on-story-sky: #ffffff;
  --story-sky-soft: #d7ebf5;
  --on-story-sky-soft: #18445c;

  --story-brown: #6e4b32;
  --story-brown-light: #a67c58;
  --story-grass: #6f9c5e;
  --story-grass-deep: #48733c;
  --story-water: #5695b5;
  --story-water-deep: #2f6987;
  --story-cloud: #fffdf7;
  --story-skin-mia: #f4c6a4;
  --story-skin-oliver: #efc09a;
  --story-hair-mia: #5b3722;
  --story-hair-oliver: #8a4b22;
  --story-road: #7b756b;
  --story-road-line: #f5e6be;

  --error: #b83230;
  --on-error: #ffffff;

  /* Data series */
  --data-1: #2f6845;
  --data-2: #b83c2e;
  --data-3: #d19422;
  --data-4: #3b7899;
  --data-context: #b5b0a3;

  /* Fonts */
  --font-headline: 'Literata', serif;
  --font-body: 'Nunito Sans', sans-serif;
  --font-label: 'Geist Mono', monospace;

  /* Shape */
  --rounded: 0.75rem;
  --rounded-lg: 1.25rem;
  --rounded-full: 9999px;

  /* Effects */
  --shadow-soft: 0 6px 24px rgb(39 49 42 / 0.08);
  --shadow-soft-hover: 0 10px 30px rgb(39 49 42 / 0.13);
  --shadow-book: 0 14px 40px rgb(68 53 34 / 0.12), 0 2px 6px rgb(68 53 34 / 0.08);
  --border-soft: 1px solid rgb(207 195 171 / 0.75);
  --border-sketch: 2px dashed rgb(166 124 88 / 0.45);
  --focus-glow: 0 0 0 4px rgb(47 104 69 / 0.22);

  /* Shared semantic & foundation tokens */
  --positive: #2f6845;
  --positive-soft: #d8efe0;
  --warning: #9e6215;
  --warning-soft: #f5dfb0;
  --focus: #2f6845;

  /* Narrative Type Scale */
  --display-size: clamp(2rem, 1.35rem + 2.4vw, 3.1rem);
  --headline-size: clamp(1.5rem, 1.15rem + 1.4vw, 2.15rem);
  --subhead-size: clamp(1.125rem, 1.02rem + 0.5vw, 1.35rem);
  --body-size: clamp(1rem, 0.96rem + 0.2vw, 1.09375rem);
  --label-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.8125rem);

  /* Spacing scale */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 140ms;
  --dur-short: 240ms;
  --dur-long: 460ms;
}

/* Base Reset */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  overflow-x: clip;
  margin: 0;
  padding: 0;
  background-color: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: 1.62;
  background-image:
    radial-gradient(circle at 14% 12%, rgb(245 223 176 / 0.38) 0%, transparent 42%),
    radial-gradient(circle at 86% 18%, rgb(215 235 245 / 0.42) 0%, transparent 40%),
    radial-gradient(circle at 50% 92%, rgb(216 239 224 / 0.35) 0%, transparent 45%);
}
header { position: static !important; }
button, input, select, textarea { font-family: inherit; }

/* Focus Visible */
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

/* App Shell */
.storybook-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-md) var(--space-lg) var(--space-xl);
  display: grid;
  gap: var(--space-md);
}
.storybook-shell * { min-width: 0; }

/* Storybook Masthead */
.book-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  background: var(--surface-paper-white);
  border: var(--border-soft);
  border-radius: var(--rounded-lg);
  padding: var(--space-sm) var(--space-lg);
  box-shadow: var(--shadow-soft);
}

.book-brand {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.book-emblem {
  width: 44px;
  height: 44px;
  border-radius: var(--rounded);
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border: var(--border-soft);
}

.book-title-group h1 {
  font-family: var(--font-headline);
  font-size: clamp(1.05rem, 0.95rem + 0.5vw, 1.3rem);
  font-weight: 700;
  margin: 0;
  line-height: 1.2;
  color: var(--on-surface);
}

.book-subtitle {
  font-family: var(--font-label);
  font-size: var(--label-size);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--tertiary);
  margin: 0;
}

.book-status-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-sm);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--rounded-full);
  font-size: 0.85rem;
  font-weight: 700;
  background: var(--surface-container-low);
  color: var(--on-surface);
  border: var(--border-soft);
  min-height: 44px;
}

.status-pill.is-stars {
  background: var(--story-mustard-soft);
  color: var(--story-mustard-deep);
}

.status-pill.is-stickers {
  background: var(--primary-container);
  color: var(--on-primary-container);
}

.status-pill-btn {
  cursor: pointer;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.status-pill-btn:hover {
  transform: translateY(-1px);
  background: var(--surface-container);
}

/* Chapter Almanac Strip */
.chapter-ribbon {
  background: var(--surface-container-low);
  border-radius: var(--rounded);
  padding: var(--space-sm) var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  border: var(--border-soft);
  overflow-x: auto;
}

.ribbon-label {
  font-family: var(--font-label);
  font-size: var(--label-size);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--on-surface-variant);
  white-space: nowrap;
}

.ribbon-steps {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ribbon-step-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 4px 10px;
  border-radius: var(--rounded);
  border: 1px solid transparent;
  background: var(--surface-container);
  color: var(--on-surface-variant);
  font-family: var(--font-label);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}

.ribbon-step-btn:hover {
  background: var(--surface-container-high);
  transform: translateY(-1px);
}

.ribbon-step-btn.is-current {
  background: var(--primary);
  color: var(--on-primary);
}

.ribbon-step-btn.is-done {
  background: var(--primary-container);
  color: var(--on-primary-container);
}

/* Main Storybook Page Spread */
.storybook-spread {
  background: var(--surface-paper-white);
  border-radius: var(--rounded-lg);
  border: 1px solid var(--outline-variant);
  box-shadow: var(--shadow-book);
  padding: var(--space-lg);
  position: relative;
  overflow: hidden;
  min-height: 540px;
}

.storybook-spread::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: var(--border-sketch);
  border-radius: calc(var(--rounded-lg) - 4px);
  pointer-events: none;
  z-index: 1;
}

.spread-inner {
  position: relative;
  z-index: 2;
  display: grid;
  gap: var(--space-lg);
  animation: pageTurnIn var(--dur-long) var(--ease-out);
}

@keyframes pageTurnIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Typography inside Spread */
.page-kicker {
  font-family: var(--font-label);
  font-size: var(--label-size);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--story-red);
  font-weight: 600;
  margin: 0 0 4px;
}

.page-heading {
  font-family: var(--font-headline);
  font-size: var(--headline-size);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.015em;
  margin: 0;
  color: var(--on-surface);
}

.display-heading {
  font-family: var(--font-headline);
  font-size: var(--display-size);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--on-surface);
}

.page-lead {
  font-size: var(--body-size);
  color: var(--on-surface-variant);
  max-width: 65ch;
  margin: var(--space-sm) 0 0;
}

.story-quote {
  background: var(--story-mustard-soft);
  color: var(--story-mustard-deep);
  border-left: 4px solid var(--story-mustard);
  border-radius: 0 var(--rounded) var(--rounded) 0;
  padding: var(--space-md) var(--space-lg);
  font-family: var(--font-headline);
  font-style: italic;
  font-size: var(--subhead-size);
  line-height: 1.45;
  margin: 0;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 20px;
  border-radius: var(--rounded);
  border: 1px solid transparent;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
}
.btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}
.btn:active:not(:disabled) {
  transform: translateY(0);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
}
.btn-primary:hover:not(:disabled) {
  background: var(--on-primary-container);
}

.btn-red {
  background: var(--story-red);
  color: var(--on-story-red);
}

.btn-sky {
  background: var(--story-sky);
  color: var(--on-story-sky);
}

.btn-mustard {
  background: var(--story-mustard-soft);
  color: var(--story-mustard-deep);
  border-color: var(--story-mustard);
}

.btn-secondary {
  background: var(--surface-container);
  color: var(--on-surface);
  border-color: var(--outline-variant);
}

.btn-lg {
  min-height: 52px;
  padding: 14px 28px;
  font-size: 1.05rem;
  border-radius: var(--rounded-full);
}

/* Illustrated Stage Frame */
.scene-canvas {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  border: var(--border-soft);
  overflow: hidden;
  position: relative;
}

.scene-svg {
  width: 100%;
  height: auto;
  display: block;
}

/* Animated Storybook Environmental Elements */
@keyframes floatCloud {
  0%, 100% { transform: translateX(0px); }
  50% { transform: translateX(22px); }
}
@keyframes flyBird {
  0%, 100% { transform: translate(0px, 0px); }
  50% { transform: translate(18px, -7px); }
}
@keyframes driveAcross {
  0% { transform: translateX(-110px); }
  100% { transform: translateX(880px); }
}
@keyframes driveTrain {
  0% { transform: translateX(880px); }
  100% { transform: translateX(-220px); }
}
@keyframes gentleBob {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-5px); }
}
@keyframes propellerSpin {
  0% { transform: scaleX(1); }
  50% { transform: scaleX(0.2); }
  100% { transform: scaleX(1); }
}

.anim-cloud { animation: floatCloud 11s ease-in-out infinite; }
.anim-cloud-slow { animation: floatCloud 16s ease-in-out infinite reverse; }
.anim-bird { animation: flyBird 5.5s ease-in-out infinite; }
.anim-bus-loop { animation: driveAcross 13s linear infinite; }
.anim-train-loop { animation: driveTrain 17s linear infinite; }
.anim-bob { animation: gentleBob 3.2s ease-in-out infinite; }

/* Companion Selector */
.companion-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-md);
}

.companion-card {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  background: var(--surface-container-low);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded-lg);
  padding: var(--space-md);
  cursor: pointer;
  text-align: left;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.companion-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
}
.companion-card.is-selected {
  background: var(--primary-container);
  border-color: var(--primary);
  box-shadow: var(--shadow-soft);
}

/* Split Layouts (70% Visual / 30% Learning Controls) */
.split-visual-lead {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: var(--space-lg);
  align-items: start;
}

.two-col-equal {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-lg);
}

/* Cards & Learning Panels */
.story-card {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-lg);
  border: var(--border-soft);
}
.story-card.is-leaf {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.story-card.is-sky {
  background: var(--story-sky-soft);
  color: var(--on-story-sky-soft);
}
.story-card.is-mustard {
  background: var(--story-mustard-soft);
  color: var(--story-mustard-deep);
}
.story-card.is-red {
  background: var(--story-red-soft);
  color: var(--on-story-red-soft);
}

/* Vehicle Grid & Tabs */
.filter-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}

.tab-btn {
  min-height: 44px;
  padding: 8px 18px;
  border-radius: var(--rounded-full);
  border: var(--border-soft);
  background: var(--surface-container-low);
  color: var(--on-surface);
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
.tab-btn:hover { background: var(--surface-container); }
.tab-btn.is-active {
  background: var(--primary);
  color: var(--on-primary);
  border-color: var(--primary);
}

.vehicle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: var(--space-sm);
}

.vehicle-tile {
  background: var(--surface-paper-white);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded);
  padding: var(--space-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  min-height: 108px;
  text-align: center;
  transition: transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.vehicle-tile:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft);
  background: var(--surface-container-low);
}
.vehicle-tile.is-selected {
  background: var(--primary-container);
  border-color: var(--primary);
}
.vehicle-tile.is-discovered {
  box-shadow: inset 0 -3px 0 var(--story-mustard);
}

.vehicle-tile-name {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--on-surface);
}
.vehicle-tile-id {
  font-size: 0.76rem;
  color: var(--on-surface-variant);
}

/* Audio & Feedback Pills */
.audio-controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}

.feedback-banner {
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--rounded);
  font-weight: 700;
  font-size: 0.92rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.feedback-banner.is-success {
  background: var(--positive-soft);
  color: var(--on-primary-container);
}
.feedback-banner.is-warn {
  background: var(--warning-soft);
  color: var(--on-tertiary-container);
}
.feedback-banner.is-info {
  background: var(--story-sky-soft);
  color: var(--on-story-sky-soft);
}

/* Speech Bubble */
.speech-bubble {
  position: relative;
  background: var(--surface-paper-white);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded-lg);
  padding: var(--space-md) var(--space-lg);
  box-shadow: var(--shadow-soft);
}
.speech-bubble-en {
  font-family: var(--font-headline);
  font-size: var(--subhead-size);
  font-weight: 700;
  color: var(--primary);
  margin: 0 0 4px;
}
.speech-bubble-id {
  font-size: 0.9rem;
  color: var(--on-surface-variant);
  margin: 0;
}

/* Chat Messenger UI */
.chat-phone {
  background: var(--surface-paper-white);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded-lg);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.chat-topbar {
  background: var(--primary);
  color: var(--on-primary);
  padding: var(--space-sm) var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
}
.chat-messages {
  padding: var(--space-md);
  display: grid;
  gap: var(--space-sm);
  background: var(--surface-container-low);
  max-height: 360px;
  overflow-y: auto;
}
.chat-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.chat-row.is-right {
  flex-direction: row-reverse;
}
.chat-bubble-btn {
  max-width: 82%;
  text-align: left;
  background: var(--surface-paper-white);
  border: var(--border-soft);
  border-radius: 16px 16px 16px 4px;
  padding: 10px 14px;
  cursor: pointer;
  color: var(--on-surface);
  transition: transform var(--dur-micro) var(--ease-out);
}
.chat-bubble-btn:hover { transform: translateY(-1px); }
.chat-row.is-right .chat-bubble-btn {
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-radius: 16px 16px 4px 16px;
}
.chat-sender {
  font-family: var(--font-label);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.8;
  display: block;
  margin-bottom: 2px;
}

/* Interactive Map Hotspots */
.map-container {
  position: relative;
  min-height: 360px;
}

.map-node-btn {
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-out);
}
.map-node-btn:hover {
  transform: scale(1.06);
}

/* Mini Games Word Chips & Memory Cards */
.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.word-chip {
  min-height: 44px;
  padding: 8px 16px;
  border-radius: var(--rounded-full);
  border: 2px solid var(--primary);
  background: var(--surface-paper-white);
  color: var(--primary);
  font-weight: 700;
  cursor: pointer;

function ensureAudioCtx() {

  if (!Ctx) return null;
  if (!audioCtx) {
    audioCtx = new Ctx();
  }
  if (audioCtx.state === `suspended`) {

  }
  return audioCtx;
}

function speakEnglish(text, feedbackTargetId) {
  const target = feedbackTargetId ? document.getElementById(feedbackTargetId) : null;
  if (`speechSynthesis` in window && typeof SpeechSynthesisUtterance !== `undefined`) {
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = `en-US`;
      utter.rate = 0.88;
      utter.pitch = 1.04;
      if (target) {

      }
      utter.onend = function() {
        if (target) {
          target.textContent = `✓ Selesai diucapkan: "${text}"`;
        }
      };
      window.speechSynthesis.speak(utter);
      return;
    } catch (e) {
      // Fall through to gentle phonetic tone
    }
  }
  playToneCue(523.25, 0.14);
  if (target) {
    target.textContent = `📖 Teks bacaan: "${text}" (aktifkan suara peramban untuk pelafalan otomatis)`;
  }
}

function playToneCue(freq, dur) {
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = `sine`;
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.14, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

function playSuccessSound() {
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  [523.25, 659.25, 783.99].forEach(function(f, idx) {
    const now = ctx.currentTime + idx * 0.09;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = `triangle`;
    osc.frequency.setValueAtTime(f, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.27);
  });
}

    osc.type = `sine`;
    osc.frequency.setValueAtTime(f, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  });
}

function playVehicleSound(id) {
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;

  function noiseBurst(duration, filterFreq, gainVal, delay) {
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = `bandpass`;
    filter.frequency.setValueAtTime(filterFreq, now + delay);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.001, now + delay);
    gain.gain.exponentialRampToValueAtTime(gainVal, now + delay + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    src.start(now + delay);
  }

  function note(type, f1, f2, dur, vol, delay) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f1, now + delay);
    if (f2 !== f1) {
      osc.frequency.exponentialRampToValueAtTime(f2, now + delay + dur);
    }
    gain.gain.setValueAtTime(0.001, now + delay);
    gain.gain.exponentialRampToValueAtTime(vol, now + delay + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + delay + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now + delay);
    osc.stop(now + delay + dur + 0.03);
  }

  if (id === `bicycle` || id === `scooter`) {
    // Ring-ring bell!
    note(`sine`, 1880, 1880, 0.18, 0.14, 0);
    note(`sine`, 2820, 2820, 0.18, 0.08, 0);
    note(`sine`, 1880, 1880, 0.22, 0.14, 0.16);
    note(`sine`, 2820, 2820, 0.22, 0.08, 0.16);
  } else if (id === `car` || id === `taxi` || id === `van`) {
    // Engine hum + double horn beep-beep
    note(`sawtooth`, 88, 105, 0.55, 0.05, 0);
    note(`triangle`, 440, 440, 0.12, 0.14, 0.15);
    note(`triangle`, 554, 554, 0.12, 0.09, 0.15);
    note(`triangle`, 440, 440, 0.18, 0.14, 0.33);
    note(`triangle`, 554, 554, 0.18, 0.09, 0.33);
  } else if (id === `bus` || id === `truck`) {
    // Deep diesel rumble + air horn
    note(`sawtooth`, 62, 68, 0.75, 0.07, 0);
    note(`sawtooth`, 165, 165, 0.42, 0.11, 0.18);
    note(`sawtooth`, 207, 207, 0.42, 0.09, 0.18);
  } else if (id === `motorcycle`) {
    // Revving vroom-vroom
    note(`sawtooth`, 82, 210, 0.32, 0.11, 0);
    note(`sawtooth`, 210, 110, 0.28, 0.09, 0.32);
    note(`sawtooth`, 110, 240, 0.35, 0.11, 0.6);
  } else if (id === `train`) {
    // Chug + classic steam/train whistle chord
    noiseBurst(0.14, 700, 0.12, 0);
    noiseBurst(0.14, 700, 0.12, 0.18);
    note(`triangle`, 392, 392, 0.55, 0.12, 0.36);
    note(`triangle`, 493.88, 493.88, 0.55, 0.1, 0.36);
    note(`triangle`, 587.33, 587.33, 0.55, 0.09, 0.36);
  } else if (id === `ambulance` || id === `firetruck`) {
    // Two-tone siren
    note(`triangle`, 660, 660, 0.24, 0.13, 0);
    note(`triangle`, 880, 880, 0.24, 0.13, 0.24);
    note(`triangle`, 660, 660, 0.24, 0.13, 0.48);
    note(`triangle`, 880, 880, 0.24, 0.13, 0.72);
  } else if (id === `boat` || id === `ferry` || id === `ship`) {
    // Boat/Ship foghorn + water splash
    const baseFreq = id === `ship` ? 110 : 155;
    noiseBurst(0.6, 500, 0.07, 0);
    note(`sawtooth`, baseFreq, baseFreq * 0.96, 0.65, 0.12, 0.1);
    note(`triangle`, baseFreq * 1.5, baseFreq * 1.45, 0.65, 0.08, 0.1);
  } else if (id === `submarine`) {
    // Sonar ping!
    note(`sine`, 1320, 1315, 0.65, 0.18, 0);
    note(`sine`, 1320, 1315, 0.45, 0.07, 0.45);
  } else if (id === `airplane`) {
    // Jet whoosh + friendly ding-dong
    noiseBurst(0.85, 950, 0.14, 0);
    note(`sine`, 587, 587, 0.18, 0.11, 0.55);
    note(`sine`, 494, 494, 0.25, 0.11, 0.75);
  } else if (id === `helicopter`) {
    // Rotor chop chop chop
    for (let i = 0; i < 6; i++) {
      noiseBurst(0.08, 340, 0.16, i * 0.11);
      note(`triangle`, 75, 58, 0.08, 0.11, i * 0.11);
    }
  } else if (id === `hotairballoon`) {
    // Propane burner soft whoosh
    noiseBurst(0.75, 420, 0.18, 0);
  }
}

  else if (p === 3) html = renderPage3HowTravel();
  else if (p === 4) html = renderPage4RoadRail();
  else if (p === 5) html = renderPage5HarborAir();
  else if (p === 6) html = renderPage6Chat();
  else if (p === 7) html = renderPage7Missions();
  else if (p === 8) html = renderPage8SchoolGate();
  else if (p === 9) html = renderPage9Games();
  else if (p === 10) html = renderPage10Awards();

  stage.innerHTML = `<div class="spread-inner">${html}</div>`;
  updateHeaderStats();
  updateRibbon();
  updateFooterNav();

}

// ---------------- PAGE 1: INTERACTIVE STORY MAP ----------------
function renderPage1Map() {
  const visitedCount = appState.stickers.length;
  const pct = Math.round((visitedCount / STICKERS.length) * 100);

  const nodesSvg = MAP_DESTINATIONS.map(function(dest) {
    const unlocked = appState.highestPage >= dest.page || dest.page <= 2;
    const isCurrent = appState.currentPage === dest.page;
    return `
      <g class="map-node-btn" onclick="goToPage(${dest.page})" role="button" tabindex="0">
        <circle cx="${dest.x}" cy="${dest.y}" r="34" fill="${unlocked ? `var(--surface-paper-white)` : `var(--surface-container-high)`}" stroke="${dest.color}" stroke-width="4"/>
        <circle cx="${dest.x}" cy="${dest.y - 26}" r="12" fill="${dest.color}"/>
        <text x="${dest.x}" y="${dest.y - 22}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-primary)">${dest.num}</text>
        <text x="${dest.x}" y="${dest.y + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--on-surface)">${dest.name}</text>
        <text x="${dest.x}" y="${dest.y + 18}" text-anchor="middle" font-size="9.5" fill="var(--on-surface-variant)">${dest.sub}</text>
        ${isCurrent ? `<circle cx="${dest.x}" cy="${dest.y}" r="39" fill="none" stroke="var(--story-mustard)" stroke-width="2" stroke-dasharray="4 4"/>` : ``}

  return `

  } else if (g === `sentence`) {
    const puzzles = [
      { target: [`I`, `go`, `to school`, `by`, `bus.`], scrambled: [`by`, `bus.`, `I`, `to school`, `go`] },
      { target: [`How`, `do`, `you`, `come`, `to school?`], scrambled: [`you`, `come`, `How`, `to school?`, `do`] }
    ];
    const puz = puzzles[gameSentenceIdx % puzzles.length];
    board = `
      <div class="story-card is-leaf">
        <h3>Game 4: Build a Sentence — Susun Kalimat Bahasa Inggris!</h3>
        <p>Ketuk kata-kata di bawah secara berurutan:</p>
        <div class="speech-bubble" style="min-height:58px; margin-bottom:12px;">
          <strong>${gameSentenceBuilt.map(function(i) { return puz.scrambled[i]; }).join(` `) || `... (pilih kata)`}</strong>
        </div>
        <div class="word-bank">
          ${puz.scrambled.map(function(w, idx) {
            const used = gameSentenceBuilt.indexOf(idx) !== -1;
            return `<button type="button" class="word-chip ${used ? `is-used` : ``}" ${used ? `disabled` : ``} onclick="pickSentenceWord(${idx})">${w}</button>`;

        </div>
        <p id="game-msg" style="margin:10px 0 0; font-weight:700;"></p>
      </div>
    `;
  } else if (g === `odd`) {
    const sets = [
      { items: [`car`, `bus`, `submarine`, `bicycle`], odd: `submarine`, why: `Submarine bergerak di bawah air, sedangkan Car, Bus, dan Bicycle di darat!` },
      { items: [`airplane`, `helicopter`, `hotairballoon`, `ferry`], odd: `ferry`, why: `Ferry berlayar di atas air, sedangkan tiga lainnya terbang di udara!` }
    ];
    const cur = sets[gameOddIdx % sets.length];
    board = `
      <div class="story-card is-red">
        <h3>Game 5: Which One Is Different? — Mana yang Berbeda?</h3>
        <p>Ketuk satu kendaraan yang tempat berjalannya berbeda dari ketiga lainnya:</p>
        <div class="vehicle-grid">
          ${cur.items.map(function(id) {
            const v = getVehicle(id);
            return `<button type="button" class="vehicle-tile" onclick="checkOddGame('${id}')">${renderVehicleSVG(id, 90, 60)}<span class="vehicle-tile-name">${v.en}</span></button>`;
          }).join(``)}
        </div>
        <p id="game-msg" style="margin:10px 0 0; font-weight:700;"></p>
      </div>
    `;
  } else if (g === `memory`) {
    if (gameMemoryCards.length === 0) initMemoryGame();
    board = `
      <div class="story-card is-sky">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
          <h3 style="margin:0;">Game 6: Transportation Memory</h3>
          <button type="button" class="btn btn-secondary" onclick="initMemoryGame(); renderCurrentPage();">Acak Ulang</button>
        </div>
        <div class="memory-grid">
          ${gameMemoryCards.map(function(vid, idx) {
            const flipped = gameMemoryFlipped.indexOf(idx) !== -1;
            const matched = gameMemoryMatched.indexOf(idx) !== -1;
            const v = getVehicle(vid);
            return `
              <button type="button" class="memory-card ${flipped ? `is-flipped` : ``} ${matched ? `is-matched` : ``}" onclick="flipMemoryCard(${idx})">
                ${flipped || matched ? `${renderVehicleSVG(vid, 68, 44)}<span>${v.en}</span>` : `<span>?</span>`}
              </button>
            `;
          }).join(``)}
        </div>
        <p id="game-msg" style="margin:10px 0 0; font-weight:700;"></p>
      </div>
    `;
  } else if (g === `listen`) {
    const opts = [`airplane`, `fire truck`, `ferry`, `scooter`];
    const optIds = [`airplane`, `firetruck`, `ferry`, `scooter`];
    const targetV = getVehicle(gameListenTarget);
    board = `
      <div class="story-card is-mustard">
        <h3>Game 7: Listen and Choose — Dengar & Pilih Gambar!</h3>
        <button type="button" class="btn btn-primary" onclick="speakEnglish('${targetV.en}', 'game-msg')">

        </button>
        <div class="vehicle-grid" style="margin-top:12px;">
          ${optIds.map(function(id) {
            return `<button type="button" class="vehicle-tile" onclick="checkListenGame('${id}')">${renderVehicleSVG(id, 90, 60)}<span class="vehicle-tile-id">Pilih ini</span></button>`;
          }).join(``)}
        </div>
        <p id="game-msg" style="margin:10px 0 0; font-weight:700;"></p>
      </div>
    `;
  }

  return `
    <div>
      <p class="page-kicker">Halaman 10 • Taman Mini-Game Interaktif</p>

// ============================================================
// 6. INTERACTION HANDLERS (All hoisted function declarations)
// ============================================================
function escapeHtml(str) {
  return String(str || ``)
    .replace(/&/g, `&amp;`)
    .replace(/</g, `&lt;`)
    .replace(/>/g, `&gt;`)
    .replace(/"/g, `&quot;`);
}

function goToPage(idx) {
  if (idx < 0 || idx >= PAGES.length) return;
  appState.currentPage = idx;
  if (idx > appState.highestPage) appState.highestPage = idx;
  saveState();
  renderCurrentPage();
  window.scrollTo({ top: 0, behavior: `smooth` });
}

function nextPage() {
  if (appState.currentPage < PAGES.length - 1) {
    goToPage(appState.currentPage + 1);
  }
}

function prevPage() {
  if (appState.currentPage > 0) {
    goToPage(appState.currentPage - 1);
  }
}

function selectCompanion(who) {
  appState.companion = who;
  playToneCue(who === `mia` ? 587 : 494, 0.14);
  saveState();
  renderCurrentPage();
}

function setVehicleCategory(cat) {
  appState.vehicleCategory = cat;

}

  appState.selectedVehicleId = id;

function resetSentenceGame() {
  gameSentenceBuilt = [];
  renderCurrentPage();
}

function checkSentenceGame() {
  const puzzles = [
    { target: [`I`, `go`, `to school`, `by`, `bus.`], scrambled: [`by`, `bus.`, `I`, `to school`, `go`] },
    { target: [`How`, `do`, `you`, `come`, `to school?`], scrambled: [`you`, `come`, `How`, `to school?`, `do`] }
  ];
  const puz = puzzles[gameSentenceIdx % puzzles.length];
  const builtStr = gameSentenceBuilt.map(function(i) { return puz.scrambled[i]; }).join(` `);
  const targetStr = puz.target.join(` `);
  const el = document.getElementById(`game-msg`);
  if (builtStr === targetStr) {
    playSuccessSound();
    markGameWon(`sentence`);
    speakEnglish(targetStr);
    gameSentenceIdx++;
    gameSentenceBuilt = [];
    renderCurrentPage();
    const after = document.getElementById(`game-msg`);
    if (after) after.textContent = `🎉 Kalimat sempurna: "${targetStr}"`;
  } else {
    playTryAgainSound();
    if (el) el.textContent = `Susunan masih kurang tepat. Coba klik "Ulangi Susunan" ya!`;
  }
}

function checkOddGame(pick) {
  const sets = [
    { odd: `submarine`, why: `Submarine bergerak di bawah air, sedangkan Car, Bus, dan Bicycle di darat!` },
    { odd: `ferry`, why: `Ferry berlayar di atas air, sedangkan tiga lainnya terbang di udara!` }
  ];
  const cur = sets[gameOddIdx % sets.length];
  const el = document.getElementById(`game-msg`);
  if (pick === cur.odd) {
    playSuccessSound();
    markGameWon(`odd`);
    gameOddIdx++;
    renderCurrentPage();
    const after = document.getElementById(`game-msg`);
    if (after) after.textContent = `✓ Betul! ${cur.why}`;
  } else {
    playTryAgainSound();
    if (el) el.textContent = `Coba perhatikan tempat bergeraknya!`;
  }
}

function initMemoryGame() {
  const base = [`bus`, `train`, `boat`, `airplane`];
  const deck = base.concat(base);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = deck[i];
    deck[i] = deck[j];
    deck[j] = tmp;
  }
  gameMemoryCards = deck;
  gameMemoryFlipped = [];
  gameMemoryMatched = [];
}

function flipMemoryCard(idx) {
  if (gameMemoryMatched.indexOf(idx) !== -1 || gameMemoryFlipped.indexOf(idx) !== -1) return;
  if (gameMemoryFlipped.length >= 2) return;
  gameMemoryFlipped.push(idx);
  playToneCue(600, 0.08);
  renderCurrentPage();

  if (gameMemoryFlipped.length === 2) {
    const a = gameMemoryFlipped[0];
    const b = gameMemoryFlipped[1];
    if (gameMemoryCards[a] === gameMemoryCards[b]) {
      gameMemoryMatched.push(a, b);
      gameMemoryFlipped = [];
      playSuccessSound();
      if (gameMemoryMatched.length === gameMemoryCards.length) {
        markGameWon(`memory`);
      }
      renderCurrentPage();
    } else {
      setTimeout(function() {
        gameMemoryFlipped = [];
        renderCurrentPage();
      }, 650);
    }
  }
}

function checkListenGame(pick) {
  const el = document.getElementById(`game-msg`);
  if (pick === gameListenTarget) {
    playSuccessSound();
    markGameWon(`listen`);
    const optIds = [`airplane`, `firetruck`, `ferry`, `scooter`];
    gameListenTarget = optIds[(optIds.indexOf(pick) + 1) % optIds.length];
    renderCurrentPage();
    const after = document.getElementById(`game-msg`);
    if (after) after.textContent = `🎉 Benar! Sekarang dengarkan kata berikutnya!`;
  } else {
    playTryAgainSound();
    if (el) el.textContent = `Itu ${getVehicle(pick).en}. Dengarkan lagi kata Inggrisnya!`;
  }
}

}

function downloadCertificatePng() {
  const canvas = document.createElement(`canvas`);
  canvas.width = 960;
  canvas.height = 600;
  const ctx = canvas.getContext(`2d`);
  if (!ctx) return;

  // Classic Cream Certificate Canvas
  ctx.fillStyle = `#faf5ea`;
  ctx.fillRect(0, 0, 960, 600);
  ctx.strokeStyle = `#d19422`;
  ctx.lineWidth = 14;
  ctx.strokeRect(24, 24, 912, 552);
  ctx.strokeStyle = `#2f6845`;
  ctx.lineWidth = 3;
  ctx.strokeRect(42, 42, 876, 516);

  ctx.fillStyle = `#2f6845`;
  ctx.font = `bold 24px sans-serif`;
  ctx.textAlign = `center`;
  ctx.fillText(`CERTIFICATE OF ACHIEVEMENT`, 480, 115);

  ctx.fillStyle = `#27312a`;
  ctx.font = `bold 40px serif`;
  ctx.fillText(`The Little Transportation Adventure`, 480, 175);

  const name = appState.learnerName || (appState.companion === `mia` ? `Sahabat Mia` : `Sahabat Oliver`);
  ctx.fillStyle = `#b83c2e`;
  ctx.font = `bold 44px serif`;
  ctx.fillText(name, 480, 290);

  ctx.fillStyle = `#49544b`;
  ctx.font = `24px sans-serif`;
  ctx.fillText(`Kendaraan Ditemukan: ${appState.discoveredVehicles.length}/18   |   Stiker: ${appState.stickers.length}/8   |   Bintang: ${appState.stars}`, 480, 385);
  ctx.fillText(`Teman Petualangan: ${appState.companion === `mia` ? `Mia` : `Oliver`} (CEFR A1-A2)`, 480, 440);

  const dataUrl = canvas.toDataURL(`image/png`);
  const base64 = dataUrl.split(`,`)[1];

  if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === `function`) {
    window.notebookAppApi.triggerFileDownload({
      content: base64,
      contentType: `image/png`,
      encoding: `base64`,
      filename: `Little_Transportation_Certificate.png`
    });
    const msg = document.getElementById(`cert-msg`);
    if (msg) msg.textContent = `✓ Sertifikat PNG sedang diunduh!`;
  } else {
    const msg = document.getElementById(`cert-msg`);
    if (msg) msg.textContent = `Sertifikat siap dicetak!`;
  }
}

function handleResetProgress(btn) {
  if (btn.dataset.armed !== `true`) {
    btn.dataset.armed = `true`;
    btn.textContent = `Klik lagi untuk konfirmasi reset`;
    return;
  }
  btn.dataset.armed = `false`;
  appState = {
    companion: `mia`,
    currentPage: 0,
    highestPage: 0,
    stars: 0,
    stickers: [],
    discoveredVehicles: [`bus`],
    selectedVehicleId: `bus`,
    vehicleCategory: `all`,
    chapter2Mode: `bus`,
    roadFoundCount: 0,
    roadFoundIds: [],
    roadQuizSolved: false,
    harborBoat: `boat`,
    harborSailed: false,
    airportLaunched: false,
    chatQuizIndex: 0,
    chatQuizSolved: [false, false],
    customChatFriend: `Oliver`,
    customChatPlace: `the beach`,
    customChatVehicle: `bus`,
    missionsSolved: [false, false, false],
    schoolClicked: [],
    schoolMatchSolved: false,
    personalSchoolMode: ``,
    personalSchoolText: ``,
    activeGame: `hunter`,
    gamesWon: [],
    learnerName: ``
  };
  saveState();
  renderCurrentPage();
}

// ============================================================
// 7. SHELL CHROME UPDATERS & INITIALIZATION
// ============================================================
function updateHeaderStats() {
  const compEl = document.getElementById(`hdr-companion-name`);
  const starsEl = document.getElementById(`hdr-stars`);
  const stickersEl = document.getElementById(`hdr-stickers`);
  if (compEl) compEl.textContent = appState.companion === `mia` ? `Mia` : `Oliver`;
  if (starsEl) starsEl.textContent = String(appState.stars);
  if (stickersEl) stickersEl.textContent = String(appState.stickers.length);
}

function updateRibbon() {
  const container = document.getElementById(`chapter-ribbon-steps`);
  if (!container) return;
  container.innerHTML = PAGES.map(function(p, idx) {
    const isCur = idx === appState.currentPage;
    const isDone = idx < appState.highestPage && !isCur;
    return `<button type="button" class="ribbon-step-btn ${isCur ? `is-current` : ``} ${isDone ? `is-done` : ``}" onclick="goToPage(${idx})" title="${p.title}">${p.short}</button>`;
  }).join(``);
}

function updateFooterNav() {
  const prevBtn = document.getElementById(`btn-prev-page`);
  const nextBtn = document.getElementById(`btn-next-page`);
  const nextLbl = document.getElementById(`btn-next-label`);
  const indicator = document.getElementById(`footer-page-indicator`);
  const cur = appState.currentPage;
  const pageObj = PAGES[cur];

  if (prevBtn) prevBtn.disabled = cur === 0;
  if (nextBtn) nextBtn.disabled = cur === PAGES.length - 1;
  if (nextLbl) {
    nextLbl.textContent = cur < PAGES.length - 1 ? `Berikutnya: ${PAGES[cur + 1].title}` : `Halaman Terakhir`;
  }
  if (indicator) {
    indicator.textContent = `Halaman ${cur + 1} dari ${PAGES.length} — ${pageObj.title}`;
  }
}

async function initApp() {
  if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
    try {
      const saved = await window.notebookAppApi.getAppState();
      if (saved && typeof saved === `object`) {
        appState = Object.assign(appState, saved);
      }
    } catch (e) {
      // Proceed with default initial state
    }
  }
  renderCurrentPage();
  if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
    window.notebookAppApi.notifyAppReady();
  }
}

document.addEventListener(`DOMContentLoaded`, initApp);
</script>
